<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>风起晴野 — 动态立绘</title>
<style>
  :root {
    --ink: #f4efe6;
    --ink-dim: rgba(244, 239, 230, 0.66);
    --night: #0b0d10;
    --amber: #f0b429;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--night);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  #stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--night);
  }

  /* 逻辑分辨率 1664x936（原图尺寸）；JS cover 缩放 + 居中 */
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1664px;
    height: 936px;
    transform-origin: center center;
    overflow: hidden;
    background: #0b0d10;
  }

  /* 世界层：底图 + 调色 + 光；视差由 JS 写 transform */
  #world {
    position: absolute;
    inset: 0;
    will-change: transform;
    filter: contrast(1.06) saturate(1.08) brightness(1.02) sepia(0.05);
  }

  /* 呼吸缩放 + 视差都靠外扩 44px 兜底，永不露边 */
  .bg-wrap {
    position: absolute;
    inset: -44px;
    transform-origin: 50% 46%;
    animation: breath 13s ease-in-out infinite alternate;
  }
  @keyframes breath {
    from { transform: scale(1); }
    to   { transform: scale(1.012); }
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* 暖调提亮：天空顶光 + 整体暖膜 */
  .grade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    background:
      linear-gradient(to bottom, rgba(255, 245, 224, 0.26) 0%, rgba(255, 241, 216, 0.09) 20%, rgba(255, 241, 216, 0) 42%),
      radial-gradient(ellipse 72% 55% at 40% -4%, rgba(255, 240, 210, 0.38), transparent 66%);
  }

  /* 缓移的薄云雾 */
  .mist {
    position: absolute;
    top: -60px;
    height: 420px;
    width: 900px;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.3;
    background: radial-gradient(ellipse 50% 42% at 50% 50%, rgba(255, 252, 244, 0.8), transparent 70%);
    filter: blur(6px);
    animation: drift 96s linear infinite alternate;
  }
  .mist.m2 { top: -110px; width: 700px; opacity: 0.22; animation-duration: 132s; animation-delay: -40s; }
  @keyframes drift {
    from { transform: translateX(-160px); }
    to   { transform: translateX(320px); }
  }

  /* 主光源（画面上方偏左的天光） */
  .glow {
    position: absolute;
    left: 300px;
    top: -360px;
    width: 940px;
    height: 700px;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(255, 248, 230, 0.72), rgba(255, 241, 208, 0.3) 46%, transparent 72%);
    animation: sunpulse 7.5s ease-in-out infinite;
  }
  .glow.g2 {
    left: 1300px;
    top: -300px;
    width: 620px;
    height: 520px;
    opacity: 0.7;
    animation-delay: -3.2s;
  }
  @keyframes sunpulse {
    0%, 100% { opacity: 0.78; }
    50%      { opacity: 1; }
  }

  /* 光束 */
  .rays {
    position: absolute;
    left: 340px;
    top: -170px;
    width: 1040px;
    height: 760px;
    pointer-events: none;
  }
  .ray {
    position: absolute;
    top: 0;
    width: 84px;
    height: 100%;
    transform-origin: 50% 0;
    mix-blend-mode: screen;
    filter: blur(15px);
    background: linear-gradient(to bottom, rgba(255, 247, 226, 0.5), rgba(255, 247, 226, 0) 76%);
    animation: raypulse 9s ease-in-out infinite;
  }
  @keyframes raypulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.95; }
  }

  /* 飞鸟 + 流光（独立视差层） */
  #life {
    position: absolute;
    left: 0;
    top: 0;
    width: 1664px;
    height: 936px;
    z-index: 4;
    pointer-events: none;
    will-change: transform;
  }

  /* 晕角固定在舞台上，视差移动也不露黑边 */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 46%, transparent 56%, rgba(22, 17, 11, 0.4) 100%);
  }

  /* —— UI：固定在视口上，不随舞台缩放裁剪（竖屏也能看见） —— */
  #ui {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  .aigc {
    position: fixed;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    z-index: 150;
    margin: 0;
    font-size: 9px;
    line-height: 1.3;
    font-weight: 400;
    color: rgba(235, 229, 218, 0.5);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
    pointer-events: none;
  }

  .title-block {
    position: absolute;
    left: 48px;
    bottom: 52px;
    max-width: 460px;
    text-shadow: 0 2px 16px rgba(20, 14, 6, 0.8);
  }
  .title-block .song {
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  .title-block .meta {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }
  .title-block .line {
    margin-top: 16px;
    font-family: "Songti SC", "Noto Serif SC", serif;
    font-size: 15px;
    line-height: 1.85;
    color: rgba(244, 239, 230, 0.82);
    min-height: 3.6em;
    transition: opacity 0.45s;
  }

  .badge {
    position: absolute;
    top: 26px;
    left: 34px;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: rgba(244, 239, 230, 0.9);
    border: 1px solid rgba(60, 50, 36, 0.45);
    background: rgba(30, 24, 16, 0.28);
    padding: 6px 12px;
    text-shadow: 0 1px 6px rgba(20, 14, 6, 0.9);
    backdrop-filter: blur(4px);
  }

  .controls {
    position: absolute;
    right: 34px;
    bottom: 36px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(244, 239, 230, 0.35);
    background: rgba(14, 12, 9, 0.5);
    color: var(--ink);
    font-size: 12px;
    letter-spacing: 0.16em;
    padding: 10px 18px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.2s;
  }
  .btn:hover {
    border-color: rgba(240, 180, 41, 0.75);
    color: var(--amber);
  }

  #gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: rgba(16, 13, 9, 0.78);
    backdrop-filter: blur(8px);
    transition: opacity 0.65s ease, visibility 0.65s;
  }
  #gate.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #gate .card { text-align: center; padding: 40px 48px; }
  #gate h1 {
    font-family: "Songti SC", "Noto Serif SC", serif;
    font-size: 34px;
    letter-spacing: 0.24em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  #gate p {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    margin-bottom: 28px;
  }
  #gate .hint {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(244, 239, 230, 0.42);
  }

  /* 窄屏：标题缩小收窄，避免和右下按钮打架 */
  @media (max-width: 600px) {
    .badge { top: 18px; left: 20px; font-size: 10px; padding: 5px 10px; }
    .title-block { left: 24px; bottom: 42px; max-width: 52vw; }
    .title-block .song { font-size: 24px; }
    .title-block .meta { font-size: 11px; margin-top: 6px; }
    .title-block .line { font-size: 13px; margin-top: 12px; }
    .controls { right: 20px; bottom: 26px; gap: 8px; }
    .btn { padding: 8px 13px; font-size: 11px; }
    #gate h1 { font-size: 27px; letter-spacing: 0.18em; }
    #gate p { font-size: 12px; }
  }
</style>
</head>
<body>
<p data-aigc-mark="1" class="aigc">AI生成</p>

  <div id="stage-wrap">
    <div id="stage">
      <div id="world">
        <div class="bg-wrap">
          <img class="bg" src="assets/bg.jpg" alt="晴野 · 山谷" draggable="false" />
        </div>
        <div class="grade"></div>
        <div class="mist m1"></div>
        <div class="mist m2"></div>
        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <div class="rays">
          <div class="ray" style="left:40px;  transform:rotate(-14deg); opacity:.55; animation-delay:-1s;"></div>
          <div class="ray" style="left:180px; transform:rotate(-8deg);  opacity:.7;  animation-delay:-3.5s;"></div>
          <div class="ray" style="left:330px; transform:rotate(-3deg);  opacity:.85; animation-delay:-5s;"></div>
          <div class="ray" style="left:480px; transform:rotate(3deg);   opacity:.75; animation-delay:-2s;"></div>
          <div class="ray" style="left:630px; transform:rotate(9deg);   opacity:.6;  animation-delay:-6.5s;"></div>
          <div class="ray" style="left:780px; transform:rotate(15deg);  opacity:.5;  animation-delay:-4.2s;"></div>
        </div>
      </div>

      <canvas id="life" width="1664" height="936"></canvas>
      <div class="vignette"></div>
    </div>

    <div id="ui">
      <div class="badge">LIVE PORTRAIT</div>
      <div class="title-block">
        <div class="song">风起晴野</div>
        <div class="meta">VALLEY · 动态立绘</div>
          <div class="line" id="lyric-line">他那双好看的蓝瞳里，总有一抹散不去的忧郁。</div>
      </div>
      <div class="controls">
        <button class="btn" id="btn-play" type="button">暂停</button>
        <button class="btn" id="btn-bird" type="button">飞鸟</button>
      </div>
    </div>
  </div>

  <div id="gate">
    <div class="card">
      <h1>风起晴野</h1>
      <p>他那双好看的蓝瞳里 · 总有一抹散不去的忧郁</p>
      <button class="btn" id="btn-enter" type="button">进入晴野</button>
      <div class="hint">点击后音乐自动播放</div>
    </div>
  </div>

  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>

<script>
(function () {
  const W = 1664;
  const H = 936;
  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const life = document.getElementById("life");
  const bgm = document.getElementById("bgm");
  const gate = document.getElementById("gate");
  const btnEnter = document.getElementById("btn-enter");
  const btnPlay = document.getElementById("btn-play");
  const btnBird = document.getElementById("btn-bird");
  const lyricLine = document.getElementById("lyric-line");

  // —— 适配：cover 铺满，锚定画面中心（人物在中偏右，居中裁剪即可框住） ——
  function fitStage() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const bleed = 1.03; // 轻微放大，消掉亚像素黑边
    const cx = W / 2;
    const cy = H / 2;
    const s = Math.max(vw / W, vh / H) * bleed;
    stage.style.left = "0px";
    stage.style.top = "0px";
    stage.style.transformOrigin = "center center";
    stage.style.transform =
      "translate(" + (vw / 2 - cx) + "px," + (vh / 2 - cy) + "px) scale(" + s + ")";
  }
  window.addEventListener("resize", fitStage);
  window.addEventListener("orientationchange", fitStage);
  window.addEventListener("load", fitStage);
  fitStage();

  // —— 视差输入（鼠标 / 触摸） ——
  let pxTarget = 0;
  let pyTarget = 0;
  let px = 0;
  let py = 0;
  function point(x, y) {
    pxTarget = (x / window.innerWidth - 0.5) * 2;
    pyTarget = (y / window.innerHeight - 0.5) * 2;
  }
  window.addEventListener("pointermove", (e) => point(e.clientX, e.clientY));
  window.addEventListener("touchmove", (e) => {
    if (e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // —— 飞鸟 + 流光 ——
  const ctx = life.getContext("2d");
  let lifeOn = true;
  function rnd(a, b) { return a + Math.random() * (b - a); }

  const birds = [];
  function spawnBird(b, first) {
    b.dir = Math.random() < 0.5 ? -1 : 1;
    // 两条航道，严格避开人物（画面中部 x 545~1175 为禁飞区）
    if (!first) {
      if (Math.random() < 0.3) b.lane = b.lane === "L" ? "R" : "L";
    } else {
      b.lane = Math.random() < 0.55 ? "L" : "R";
    }
    if (b.lane === "L") { b.x0 = -170; b.x1 = 545; }
    else { b.x0 = 1175; b.x1 = W + 170; }
    b.x = first ? rnd(b.x0, b.x1) : (b.dir > 0 ? b.x0 : b.x1);
    b.baseY = rnd(36, 340);
    b.s = rnd(0.7, 1.6);
    if (Math.random() < 0.18) b.s = rnd(2.6, 3.4); // 偶尔一只近景大鸟
    b.sp = rnd(95, 210) * (0.7 + b.s * 0.3);
    b.driftA = rnd(5, 24);
    b.driftT = rnd(0.12, 0.3);
    b.ph = rnd(0, Math.PI * 2);
    b.flapHz = rnd(2.8, 4.4);
    b.a = rnd(0.5, 0.88);
    b.white = Math.random() < 0.3;
    b.blur = b.s > 2.4 || Math.random() < 0.15;
    b.seed = rnd(0, 10);
  }
  for (let i = 0; i < 9; i++) spawnBird(birds[i] = birds[i] || {}, i < 7);

  const motes = [];
  for (let i = 0; i < 70; i++) {
    motes.push({
      x: rnd(0, W), y: rnd(0, H),
      r: rnd(0.8, 2.4),
      vx: rnd(-5, 9), vy: rnd(-16, -3),
      ph: rnd(0, Math.PI * 2),
      tw: rnd(0.7, 1.6),
    });
  }

  function drawBird(b, t) {
    const w = Math.sin((t * b.flapHz + b.seed) * Math.PI * 2);
    const up = 13 * w;
    ctx.save();
    ctx.translate(b.x, b.baseY + Math.sin(t * b.driftT * Math.PI * 2 + b.ph) * b.driftA);
    ctx.rotate(Math.sin(t * 0.55 + b.ph) * 0.12);
    ctx.scale(b.dir * b.s, b.s);
    if (b.blur && "filter" in ctx) ctx.filter = "blur(" + (b.s > 2.4 ? 5 : 2.5) + "px)";
    ctx.globalAlpha = b.a;
    ctx.fillStyle = b.white ? "rgba(250, 248, 242, 0.95)" : "rgba(44, 38, 32, 0.92)";
    ctx.beginPath();
    ctx.moveTo(-17, -up);
    ctx.quadraticCurveTo(-8, 4 - up * 0.35, 0, 3);
    ctx.quadraticCurveTo(8, 4 - up * 0.35, 17, -up);
    ctx.quadraticCurveTo(8, 8 - up * 0.2, 0, 7);
    ctx.quadraticCurveTo(-8, 8 - up * 0.2, -17, -up);
    ctx.fill();
    if ("filter" in ctx) ctx.filter = "none";
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    // 视差缓动：底图 ±14px，飞鸟层 ±28px（更近，动得更多）
    px += (pxTarget - px) * Math.min(1, dt * 3);
    py += (pyTarget - py) * Math.min(1, dt * 3);
    world.style.transform = "translate3d(" + (-px * 14) + "px," + (-py * 10) + "px,0)";
    life.style.transform = "translate3d(" + (-px * 28) + "px," + (-py * 20) + "px,0)";

    ctx.clearRect(0, 0, W, H);
    if (lifeOn) {
      for (const b of birds) {
        b.x += b.dir * b.sp * dt;
        if (b.dir > 0 && b.x > b.x1) { spawnBird(b, false); }
        else if (b.dir < 0 && b.x < b.x0) { spawnBird(b, false); }
        drawBird(b, t);
      }

      ctx.globalCompositeOperation = "lighter";
      for (const m of motes) {
        m.x += (m.vx + Math.sin(t * 0.6 + m.ph) * 4) * dt;
        m.y += m.vy * dt;
        if (m.y < -8) { m.y = H + 8; m.x = rnd(0, W); }
        if (m.x < -8) m.x = W + 8;
        if (m.x > W + 8) m.x = -8;
        const a = 0.2 + 0.45 * (0.5 + 0.5 * Math.sin(t * m.tw + m.ph));
        ctx.fillStyle = "rgba(255, 236, 196," + a.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // —— 文案轮播 ——
  const lyrics = [
    "他那双好看的蓝瞳里，总有一抹散不去的忧郁。",
    "阳光落在肩上，却照不进眼底那片海。",
    "风把影子拉得很长，像一句没说完的话。",
    "他低头笑了一下，忧郁又藏回了睫毛里。",
    "远山、河流、飞鸟，都路过他的沉默。",
    "蓝色是天空的颜色，也是心事的颜色。",
    "有些安静不用开口，看一眼就懂了。",
    "他站在风里，像一封没寄出的信。",
  ];
  let li = 0;
  setInterval(() => {
    li = (li + 1) % lyrics.length;
    lyricLine.style.opacity = 0;
    setTimeout(() => {
      lyricLine.textContent = lyrics[li];
      lyricLine.style.opacity = 1;
    }, 420);
  }, 5400);

  // —— 音乐 ——
  let started = false;
  function playMusic() {
    bgm.volume = 0.85;
    const p = bgm.play();
    if (p && p.catch) p.catch(() => {});
    btnPlay.textContent = "暂停";
    started = true;
  }
  function tryAutoplay() {
    bgm.volume = 0.85;
    const p = bgm.play();
    if (p && p.then) {
      p.then(() => {
        gate.classList.add("hidden");
        started = true;
        btnPlay.textContent = "暂停";
      }).catch(() => {});
    }
  }
  btnEnter.addEventListener("click", () => {
    gate.classList.add("hidden");
    playMusic();
  });
  window.addEventListener("load", () => {
    tryAutoplay();
    setTimeout(tryAutoplay, 250);
  });
  document.addEventListener("pointerdown", () => {
    if (!started) {
      playMusic();
      gate.classList.add("hidden");
    }
  }, { once: true });
  btnPlay.addEventListener("click", (e) => {
    e.stopPropagation();
    if (bgm.paused) playMusic();
    else {
      bgm.pause();
      btnPlay.textContent = "播放";
    }
  });
  btnBird.addEventListener("click", (e) => {
    e.stopPropagation();
    lifeOn = !lifeOn;
    btnBird.textContent = lifeOn ? "飞鸟" : "静空";
    if (!lifeOn) ctx.clearRect(0, 0, W, H);
  });
})();
</script>
</body>
</html>
